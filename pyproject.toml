[project]
name = "helix"
version = "0.1.0"
description = "Genetic-programming factor mining + deep-learning factor synthesis for A-share short-horizon touch prediction"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.0",
    "tqdm>=4.66",
    "deap>=1.4",
    "torch>=2.1",
    "tushare>=1.4.6",
]

[project.optional-dependencies]
fast = ["bottleneck>=1.3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
helix = "helix.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helix"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
# NPY002: the global np.random.seed calls are a determinism safety net for third-party
# code (DEAP, torch dataloaders), not a source of sampled values we control.
ignore = ["E501", "NPY002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
