# Trimmed GP budget for full-base neutralised mining on argus_quant.
# residualize is memory-bandwidth bound on the basis, so the cost per evaluation
# scales with the number of base columns; the budget is cut to match.
data:
  root: data
  start_date: '20180101'
  end_date: ''
  calendar_exchange: SSE
  requests_per_minute: 400
  max_retries: 5
universe:
  exclude_st: true
  min_list_days: 120
  exclude_exchanges:
  - BJ
  min_amount_kcny: 20000
  min_close: 2.0
  max_close: 1000.0
label:
  entry_offset: 1
  touch_offset: 2
  target_ratio: 1.08
  exclude_entry_limit_up: true
  limit_price_eps: 0.001
split:
  train_days: 750
  valid_days: 120
  test_days: 120
  step_days: 120
  embargo_days: 5
gp:
  population: 300
  generations: 15
  tournament_size: 7
  crossover_prob: 0.6
  mutation_prob: 0.3
  init_depth:
  - 2
  - 5
  max_depth: 8
  max_nodes: 40
  windows:
  - 3
  - 5
  - 10
  - 20
  - 60
  complexity_penalty: 0.0015
  min_daily_samples: 50
  min_coverage: 0.4
  max_abs_corr: 0.7
  n_keep: 12
  search_max_stocks: 2000
  hall_of_fame: 40
  seed: 20260811
dl:
  seq_len: 20
  hidden_size: 96
  num_layers: 2
  dropout: 0.2
  batch_size: 4096
  epochs: 30
  lr: 0.001
  weight_decay: 1.0e-05
  early_stopping_patience: 5
  pos_weight_cap: 20.0
  clip_sigma: 4.0
  seed: 20240101
backtest:
  top_k: 4
  exit_rule: close
  commission_bps: 2.5
  transfer_bps: 0.1
  stamp_sell_bps: 5.0
  stamp_sell_bps_before_cut: 10.0
  slippage_bps: 10.0
